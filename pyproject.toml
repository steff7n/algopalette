[project]
name = "algopalette"
version = "0.1.0"
description = "Generator palet kolorów w OKLCH (GUI Qt)"
requires-python = ">=3.13"
dependencies = [
    "coloraide>=8.15",
    "numpy>=2.5.4",
    "pyside6-essentials>=6.10",
]

[project.scripts]
algopalette = "algopalette.__main__:main"

[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

# Rozszerzenie natywne `algopalette._engine` (Rust, crates/py) budowane razem z paczką.
[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "src"
module-name = "algopalette._engine"
profile = "release"

# `uv sync` / `uv run` przebudowują paczkę, gdy zmieni się którykolwiek z tych plików.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.4",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: wolniejsze testy (wydajność)"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]  # l = lightness; polskie znaki i symbole

[tool.ruff.lint.per-file-ignores]
"src/algopalette/gui/help_content/*" = ["E501"]  # proza pomocy (Markdown) — łamanie wierszy psułoby akapity
